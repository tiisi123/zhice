; Alembic 配置 — T03 (M001/S01) 一次性把 27 张表 schema 迁离 prototype/apps/api/db.py 内联 SQL。
; sqlalchemy.url 由 alembic/env.py 在启动期 override（读 settings.database_url）；
; 这里的占位仅用于 "alembic offline mode" 排错，不参与生产路径。

[alembic]
script_location = alembic
prepend_sys_path = .
sqlalchemy.url = mysql+pymysql://zhice:zhice@localhost:3306/zhice
version_path_separator = os
file_template = %%(rev)s_%%(slug)s

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
