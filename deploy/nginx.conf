# T04 (M001/S01) — zhice-web nginx 配置
#
# 角色：SPA 静态托管 + /api 反代到 zhice-api（容器内 DNS 名）
# 处理三条路径：
#   1. /api/ws/*  -> WebSocket 升级到 zhice-api:8000（market 行情推送）
#   2. /api/*     -> HTTP 反代到 zhice-api:8000
#   3. /*         -> SPA fallback：try_files $uri $uri/ /index.html
#
# 上游解析：在 docker compose zhice-net 网络中，zhice-api 是稳定的 DNS 名；
# 这里不用 upstream 块（规模需要时再加）。

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # gzip 静态资源（vite build 已 hash 命名，缓存策略由前端 immutable 控制）
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1024;

    # 静态资源带强缓存（vite 构建产物文件名带 hash）
    location /assets/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # WebSocket — 必须先于 /api 普通反代，否则 location 优先级会吃掉
    location /api/ws {
        proxy_pass http://zhice-api:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 长连接：行情推送 24h 不超时
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # API 反代
    location /api/ {
        proxy_pass http://zhice-api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # SPA fallback：所有未匹配的路径回到 index.html，让 react-router 接管
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 屏蔽常见敏感路径
    location ~ /\.(?!well-known) {
        deny all;
    }
}
