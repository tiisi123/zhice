# T05 (M001/S01) — 智策 CI 硬阻断流水线
#
# 触发：pull_request + push: main
# 硬阻断 jobs（任一失败即阻断 merge）:
#   - python_syntax  — prototype/scripts/check_python_syntax.py 全树语法扫
#   - lint           — cd prototype/apps/web && npm run lint （T01 锁定 0 errors）
#   - web_build      — cd prototype/apps/web && npm run build
#   - api_contract   — py_compile 校验脚本可执行（S02 升级后接真起 api 跑契约）
#   - no_mock        — python prototype/scripts/check_no_mock.py
# 软警告 job（warn only）:
#   - typecheck      — npm run typecheck （react-hooks v7 strict 误报暂不阻断）
#
# 业主排障：GitHub Actions runs 页面 → 点进 failed run → 看具体 job 日志。
# 业主推 PR 必须等所有硬阻断 job 绿灯方可 merge（已在仓库 branch protection 里强制）。

name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python_syntax:
    name: Python 语法扫（全树）
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run check_python_syntax.py
        run: python prototype/scripts/check_python_syntax.py

  lint:
    name: Web Lint（硬阻断 0 errors）
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: prototype/apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: prototype/apps/web/package-lock.json
      - name: npm ci
        run: npm ci
      - name: npm run lint
        run: npm run lint

  web_build:
    name: Web Build（vite + tsc）
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: prototype/apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: prototype/apps/web/package-lock.json
      - name: npm ci
        run: npm ci
      - name: npm run build
        run: npm run build

  typecheck:
    name: Web Typecheck（warn only）
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    defaults:
      run:
        working-directory: prototype/apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: prototype/apps/web/package-lock.json
      - name: npm ci
        run: npm ci
      - name: npm run typecheck
        run: npm run typecheck

  api_contract:
    name: API Contract（强制 D004 三字段 + 6 值 enum + mock⟺status 一致性）
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.0.36
        env:
          MYSQL_ROOT_PASSWORD: ci-root-pass
          MYSQL_DATABASE: zhice
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping --silent"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      ZHICE_JWT_SECRET: ci-jwt-secret-not-real-prod
      ZHICE_ADMIN_PASSWORD: ci-admin-pass
      DATABASE_URL: mysql+pymysql://root:ci-root-pass@127.0.0.1:3306/zhice
      DEBUG: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: pip install prototype（含 fastapi/uvicorn/sqlalchemy/alembic/pymysql）
        run: pip install -e prototype
      - name: alembic upgrade head（在 mysql service 上建全表）
        working-directory: prototype
        run: alembic upgrade head
      - name: uvicorn 后台起 api（输出 → /tmp/uvicorn.log）
        working-directory: prototype
        # nohup + 显式 stdout/stderr 重定向：避免 GHA shell 卡在 stream-inheritance；
        # 进程在后续 step 持续可达。
        run: nohup uvicorn apps.api.main:app --host 0.0.0.0 --port 8000 > /tmp/uvicorn.log 2>&1 &
      - name: 等待 uvicorn ready（健康检查代替固定 sleep）
        run: |
          for i in $(seq 1 20); do
            if curl -sf http://127.0.0.1:8000/api/health > /dev/null; then
              echo "uvicorn ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "uvicorn 未在 20s 内响应 /api/health" >&2
          tail -n 80 /tmp/uvicorn.log >&2 || true
          exit 1
      - name: 跑 check_api_contract.py（D004 强制契约）
        working-directory: prototype
        run: python scripts/check_api_contract.py
      - name: 失败时打印 uvicorn 日志（事后排障）
        if: failure()
        run: tail -n 200 /tmp/uvicorn.log || true

  no_mock:
    name: No Mock（生产代码不得含 mock）
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run check_no_mock.py
        run: python prototype/scripts/check_no_mock.py

  playwright:
    name: Playwright Happy-Path（E2E 5 步）
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: prototype/apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: prototype/apps/web/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npx playwright test

  smoke:
    name: Smoke Test（API + Web + 契约 ×3）
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.0.36
        env:
          MYSQL_ROOT_PASSWORD: ci-root-pass
          MYSQL_DATABASE: zhice
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping --silent"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      ZHICE_JWT_SECRET: ci-jwt-secret-not-real-prod
      ZHICE_ADMIN_PASSWORD: ci-admin-pass
      DATABASE_URL: mysql+pymysql://root:ci-root-pass@127.0.0.1:3306/zhice
      DEBUG: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: prototype/apps/web/package-lock.json
      - name: pip install prototype
        run: pip install -e prototype
      - name: alembic upgrade head
        working-directory: prototype
        run: alembic upgrade head
      - name: uvicorn 后台启动
        working-directory: prototype
        run: nohup uvicorn apps.api.main:app --host 0.0.0.0 --port 8000 > /tmp/uvicorn.log 2>&1 &
      - name: 等待 uvicorn ready
        run: |
          for i in $(seq 1 20); do
            if curl -sf http://127.0.0.1:8000/api/health > /dev/null; then
              echo "uvicorn ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "uvicorn 未在 20s 内响应 /api/health" >&2
          tail -n 80 /tmp/uvicorn.log >&2 || true
          exit 1
      - name: npm ci + build + preview 后台启动
        working-directory: prototype/apps/web
        run: |
          npm ci
          npm run build
          nohup npx vite preview --port 5173 > /tmp/vite-preview.log 2>&1 &
      - name: 等待 vite preview ready
        run: |
          for i in $(seq 1 15); do
            if curl -sf http://127.0.0.1:5173/ > /dev/null; then
              echo "vite preview ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "vite preview 未在 15s 内响应" >&2
          tail -n 40 /tmp/vite-preview.log >&2 || true
          exit 1
      - name: smoke_test.py ×3
        working-directory: prototype
        run: |
          for round in 1 2 3; do
            echo "=== Smoke round $round ==="
            python scripts/smoke_test.py || exit 1
          done
      - name: 失败时打印日志
        if: failure()
        run: |
          echo "=== uvicorn ===" && tail -n 200 /tmp/uvicorn.log || true
          echo "=== vite preview ===" && tail -n 100 /tmp/vite-preview.log || true
