                                item.code && React.createElement('small', null, item.code),
                                React.createElement('small', null, item.type)
                            );
                        })
                    )
                )
            );
        }

        try {
            ReactDOM.createRoot(document.getElementById('root')).render(
                React.createElement(App)
            );
        } catch (error) {
            window.onerror(error && error.message ? error.message : error, '', 0, 0, error);
        }
    </script>
</body>
</html>
